<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Shop Garment Downloader</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
}

textarea {
    width: 100%;
    height: 350px;
    box-sizing: border-box;
    padding: 15px;
    font-family: monospace;
    font-size: 14px;
}

button {
    margin-top: 15px;
    margin-right: 10px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
}

#results {
    margin-top: 25px;
}

.success {
    background: #e7f7e7;
    padding: 15px;
    margin-bottom: 15px;
}

.error {
    background: #ffe5e5;
    padding: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
}

th {
    background: #222;
    color: white;
}
</style>

</head>

<body>

<div class="container">

<h1>Print Shop Garment Downloader</h1>

<p>Paste your YoPrint line items below.</p>

<textarea id="input"></textarea>

<br>

<button onclick="findGarments()">Find Garments</button>

<button onclick="testParser()">TEST</button>

<button onclick="clearAll()">Clear</button>

<div id="results"></div>

</div>

<script>

function findGarments() {

    const text = document.getElementById("input").value;

    parseText(text);

}


function testParser() {

    const testData = `
| **Tultex291**Unisex Heavyweight Jersey Long Sleeve T-Shirt | **S&S Activewear** | [Black](https://www.ssactivewear.com/Images/ColorSwatch/27725_fs.jpg)**BlackS** | 7 |
| **Tultex291**Unisex Heavyweight Jersey Long Sleeve T-Shirt | **S&S Activewear** | [Black](https://www.ssactivewear.com/Images/ColorSwatch/27725_fs.jpg)**BlackM** | 5 |
| **CORE365CE10LW**Women's Capital Performance Long Sleeve T-Shirt | **S&S Activewear** | [Forest](https://www.ssactivewear.com/Images/ColorSwatch/44819_fs.jpg)**ForestS** | 1 |
`;

    document.getElementById("input").value = testData;

    parseText(testData);

}


function parseText(text) {

    const results = document.getElementById("results");

    results.innerHTML = "";

    if (!text.trim()) {

        results.innerHTML =
            '<div class="error">Please paste YoPrint data.</div>';

        return;
    }


    const lines = text.split(/\r?\n/);

    const garments = [];

    const seen = new Set();


    for (const line of lines) {

        /*
        Find product code + product name.
        */

        const productMatch =
            line.match(/\*\*([^*]+)\*\*\s*([^|]+?)(?=\s*\||$)/);

        if (!productMatch) {
            continue;
        }


        const code = productMatch[1].trim();

        const productName = productMatch[2].trim();


        /*
        Find supplier.
        */

        let supplier = "";

        if (/S&S Activewear/i.test(line)) {
            supplier = "S&S Activewear";
        }
        else if (/SanMar/i.test(line)) {
            supplier = "SanMar";
        }

        if (!supplier) {
            continue;
        }


        /*
        Find color from the markdown link.
        */

        const colorMatch =
            line.match(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/);

        if (!colorMatch) {
            continue;
        }

        const color = colorMatch[1].trim();


        /*
        Determine brand and style.
        */

        let brand = "Unknown";

        let style = code;


        const brandPatterns = [

            ["Tultex", /^Tultex/i],

            ["CORE365", /^CORE365/i],

            ["ANETIK", /^ANETIK/i],

            ["Next Level", /^Next Level/i],

            ["Gildan", /^Gildan/i],

            ["Port & Company", /^Port & Company/i],

            ["Port Authority", /^Port Authority/i],

            ["Bella+Canvas", /^Bella\+Canvas/i],

            ["Jerzees", /^Jerzees/i],

            ["Hanes", /^Hanes/i]

        ];


        for (const [name, pattern] of brandPatterns) {

            if (pattern.test(code)) {

                brand = name;

                style = code.replace(pattern, "").trim();

                break;
            }
        }


        /*
        Remove duplicate sizes.
        */

        const key =
            brand.toLowerCase() +
            "|" +
            style.toLowerCase() +
            "|" +
            color.toLowerCase() +
            "|" +
            supplier.toLowerCase();


        if (seen.has(key)) {
            continue;
        }


        seen.add(key);


        garments.push({

            brand: brand,

            style: style,

            product: productName,

            color: color,

            supplier: supplier

        });

    }


    /*
    Show result.
    */

    if (garments.length === 0) {

        results.innerHTML =
            '<div class="error">' +
            '<strong>NO GARMENTS DETECTED</strong>' +
            '</div>';

        return;
    }


    let html =
        '<div class="success">' +
        '<strong>' +
        garments.length +
        ' unique garment/color combinations found.' +
        '</strong>' +
        '</div>';


    html += `
<table>
<tr>
<th>#</th>
<th>Brand</th>
<th>Style</th>
<th>Product</th>
<th>Color</th>
<th>Supplier</th>
</tr>
`;


    garments.forEach((g, i) => {

        html += `
<tr>
<td>${i + 1}</td>
<td>${escapeHtml(g.brand)}</td>
<td>${escapeHtml(g.style)}</td>
<td>${escapeHtml(g.product)}</td>
<td>${escapeHtml(g.color)}</td>
<td>${escapeHtml(g.supplier)}</td>
</tr>
`;

    });


    html += "</table>";


    results.innerHTML = html;

}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function clearAll() {

    document.getElementById("input").value = "";

    document.getElementById("results").innerHTML = "";

}

</script>

</body>
</html>
