<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Print Shop Garment Downloader</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

h1 {
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 350px;
    box-sizing: border-box;
    padding: 15px;
    font-family: monospace;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
}

button {
    margin-top: 15px;
    margin-right: 10px;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 7px;
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #444;
}

#results {
    margin-top: 25px;
}

.success {
    padding: 15px;
    background: #e7f7e7;
    border-radius: 7px;
    margin-bottom: 15px;
}

.error {
    padding: 15px;
    background: #ffe5e5;
    border-radius: 7px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
}

th {
    background: #222;
    color: white;
}
</style>

</head>

<body>

<div class="container">

<h1>Print Shop Garment Downloader</h1>

<p>
Paste your YoPrint line items below.
</p>

<textarea
    id="input"
    placeholder="Paste YoPrint line items here..."
></textarea>

<br>

<button onclick="findGarments()">Find Garments</button>

<button onclick="clearAll()">Clear</button>

<div id="results"></div>

</div>

<script>

/*
========================================================
PRINT SHOP GARMENT DOWNLOADER
PARSER
========================================================

This parser is intentionally based on the actual
YoPrint format being used.

It looks for:

PRODUCT:
**Tultex291**Unisex Heavyweight Jersey Long Sleeve...

SUPPLIER:
**S&S Activewear**

COLOR:
[Black](https://...)

It completely ignores:

- Size
- Quantity
- Price
- Totals
- Fee rows
- Table formatting
- Duplicate sizes
*/


function findGarments() {

    const input =
        document.getElementById("input").value;

    const results =
        document.getElementById("results");

    results.innerHTML = "";


    if (!input.trim()) {

        results.innerHTML =
            '<div class="error">' +
            '<strong>Please paste your YoPrint line items first.</strong>' +
            '</div>';

        return;
    }


    /*
    ----------------------------------------------------
    Normalize the pasted text
    ----------------------------------------------------
    */

    const lines =
        input
        .replace(/\r/g, "")
        .split("\n");


    const garments = [];

    const seen = new Set();


    /*
    ----------------------------------------------------
    Process every line
    ----------------------------------------------------
    */

    for (let line of lines) {

        line = line.trim();


        /*
        Ignore anything that isn't a table row.
        */

        if (!line.startsWith("|")) {
            continue;
        }


        /*
        Ignore markdown separator rows.
        */

        if (line.includes("---")) {
            continue;
        }


        /*
        Ignore fee lines.
        */

        if (
            line.includes("Ink Change") ||
            line.includes("Line Item Fee") ||
            line.includes("**Fee**")
        ) {
            continue;
        }


        /*
        ------------------------------------------------
        FIND PRODUCT
        ------------------------------------------------

        We specifically look for:

        **CODE**PRODUCT NAME

        and only use the FIRST bold section.

        Example:

        **Tultex291**Unisex Heavyweight Jersey Long
        Sleeve T-Shirt
        */

        const productMatch =
            line.match(
                /\*\*([^*]+)\*\*\s*([^|]+?)\s*(?=\||$)/
            );


        if (!productMatch) {
            continue;
        }


        const code =
            productMatch[1].trim();


        const productName =
            productMatch[2].trim();


        /*
        ------------------------------------------------
        MAKE SURE THIS IS ACTUALLY A GARMENT
        ------------------------------------------------
        */

        if (!code || !productName) {
            continue;
        }


        /*
        ------------------------------------------------
        FIND SUPPLIER
        ------------------------------------------------
        */

        let supplier = "";


        if (
            line
            .toLowerCase()
            .includes("s&s activewear")
        ) {

            supplier = "S&S Activewear";

        }
        else if (
            line
            .toLowerCase()
            .includes("sanmar")
        ) {

            supplier = "SanMar";
        }


        /*
        If there isn't a supported supplier,
        skip the line.
        */

        if (!supplier) {
            continue;
        }


        /*
        ------------------------------------------------
        FIND COLOR
        ------------------------------------------------

        YoPrint gives us:

        [Black](https://www.ssactivewear.com/...)

        We take:

        Black
        */

        const colorMatch =
            line.match(
                /\[([^\]]+)\]\(\s*https?:\/\/[^)]+\)/
            );


        if (!colorMatch) {
            continue;
        }


        const color =
            colorMatch[1].trim();


        if (!color) {
            continue;
        }


        /*
        ------------------------------------------------
        DETERMINE BRAND
        ------------------------------------------------
        */

        const brandList = [

            {
                name: "Tultex",
                regex: /^Tultex/i
            },

            {
                name: "CORE365",
                regex: /^CORE365/i
            },

            {
                name: "ANETIK",
                regex: /^ANETIK/i
            },

            {
                name: "Next Level",
                regex: /^Next Level/i
            },

            {
                name: "Gildan",
                regex: /^Gildan/i
            },

            {
                name: "Port & Company",
                regex: /^Port & Company/i
            },

            {
                name: "Port Authority",
                regex: /^Port Authority/i
            },

            {
                name: "Bella+Canvas",
                regex: /^Bella\+Canvas/i
            },

            {
                name: "Jerzees",
                regex: /^Jerzees/i
            },

            {
                name: "Hanes",
                regex: /^Hanes/i
            },

            {
                name: "Independent Trading Co",
                regex: /^Independent Trading Co/i
            }

        ];


        let brand = "Unknown";

        let style = code;


        for (const item of brandList) {

            if (item.regex.test(code)) {

                brand = item.name;

                style =
                    code
                    .replace(item.regex, "")
                    .trim();

                break;
            }
        }


        /*
        ------------------------------------------------
        UNIQUE KEY
        ------------------------------------------------

        Same garment in different sizes becomes ONE.

        Example:

        Tultex 291 Black S
        Tultex 291 Black M
        Tultex 291 Black L
        Tultex 291 Black XL

        becomes:

        Tultex 291 Black
        */

        const key =
            brand.toLowerCase() +
            "|" +
            style.toLowerCase() +
            "|" +
            color.toLowerCase() +
            "|" +
            supplier.toLowerCase();


        if (seen.has(key)) {
            continue;
        }


        seen.add(key);


        /*
        ------------------------------------------------
        SAVE GARMENT
        ------------------------------------------------
        */

        garments.push({

            brand: brand,

            style: style,

            productName: productName,

            color: color,

            supplier: supplier

        });

    }


    /*
    ====================================================
    SHOW RESULTS
    ====================================================
    */


    if (garments.length === 0) {

        results.innerHTML =

            '<div class="error">' +

            '<strong>No garments detected.</strong>' +

            '<br><br>' +

            'The pasted YoPrint information did not ' +
            'contain a recognizable garment row.' +

            '</div>';

        return;
    }


    /*
    ----------------------------------------------------
    Success message
    ----------------------------------------------------
    */

    let html =

        '<div class="success">' +

        '<strong>' +

        garments.length +

        ' unique garment/color combinations found.</strong>' +

        '</div>';


    /*
    ----------------------------------------------------
    Results table
    ----------------------------------------------------
    */

    html +=

        '<table>' +

        '<thead>' +

        '<tr>' +

        '<th>#</th>' +

        '<th>Brand</th>' +

        '<th>Style</th>' +

        '<th>Product</th>' +

        '<th>Color</th>' +

        '<th>Supplier</th>' +

        '</tr>' +

        '</thead>' +

        '<tbody>';


    garments.forEach(
        function(garment, index) {

            html +=

                '<tr>' +

                '<td>' +
                (index + 1) +
                '</td>' +

                '<td>' +
                escapeHtml(garment.brand) +
                '</td>' +

                '<td>' +
                escapeHtml(garment.style) +
                '</td>' +

                '<td>' +
                escapeHtml(garment.productName) +
                '</td>' +

                '<td>' +
                escapeHtml(garment.color) +
                '</td>' +

                '<td>' +
                escapeHtml(garment.supplier) +
                '</td>' +

                '</tr>';

        }
    );


    html +=

        '</tbody>' +

        '</table>';


    results.innerHTML = html;

}


/*
========================================================
SECURITY
========================================================
*/

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/*
========================================================
CLEAR
========================================================
*/

function clearAll() {

    document.getElementById("input").value = "";

    document.getElementById("results").innerHTML = "";

}

</script>

</body>
</html>
